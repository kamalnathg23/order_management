spring.application.name=order-management

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/order_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:orderuser}
spring.datasource.password=${DB_PASSWORD:Order@123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT (override JWT_SECRET in production; must be >= 32 bytes)
app.jwt.secret=${JWT_SECRET:change-me-this-is-a-dev-only-secret-key-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
app.admin.email=${ADMIN_EMAIL:admin@shop.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
